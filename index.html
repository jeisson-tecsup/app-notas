<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>App Notas</title>
</head>
<body>
    <h1>Mis notas</h1>
    <input id="nota" placeholder="Escribe una nota">
    <button onclick="agregar()">Agregar</button>
    <ul id="lista"></ul>

    <h2>Arquitectura</h2>
    <pre class="mermaid">
graph LR
A[Usuario] --> B[Frontend]
B --> C[API]
C --> D[(Base de datos)]
    </pre>

    <h3>Flujo para agregar una nota</h3>
    <pre class="mermaid">
graph TD
A[Escribir la nota] --> B{Esta vacia?}
B -- Si --> C[Mostrar aviso]
B -- No --> D[Agregar a la lista]
D --> E[Limpiar el campo]
    </pre>

    <script>
    function agregar() {
    const texto = document.getElementById("nota").value;
    const item = document.createElement("li");
    item.textContent = texto;
    document.getElementById("lista").appendChild(item);
    }
    </script>
    <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: true });
    </script>
</body>
</html>
